repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.1
    hooks:
      - id: terraform_fmt
      - id: terraform_validate

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff
        args: [--select, "E,F,S"]

  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        files: \.sh$

      - id: packer-validate
        name: packer validate
        entry: bash -c 'for d in packer/*/; do (cd "$d" && pkrvars=$(ls *.pkrvars.hcl 2>/dev/null | head -1) && [ -n "$pkrvars" ] && packer validate -var-file=../../shared/lab-vars.json -var-file="$pkrvars" . 2>&1) || exit 1; done'
        language: system
        files: \.pkr\.hcl$
        pass_filenames: false

      - id: personal-info-check
        name: personal info check (dynamic + local patterns)
        entry: bash scripts/security/personal-info-check.sh
        language: system
        pass_filenames: false

      - id: check-live-secrets
        name: check for live GCP secret values (all versions)
        entry: bash scripts/security/check-live-secrets.sh 
        language: system
        pass_filenames: false
        verbose: true

