#!/usr/sbin/nft -f
#
# Host-based firewall for control-node, satisfying NIST 800-53
# SC-7(12) (Host-Based Protection) -- an independent, host-level
# enforcement layer alongside the VPC firewall (base SC-7), not a
# replacement for it.
#
# The VPC firewall enforces identity (GCP service accounts); this
# ruleset enforces IP, since a host firewall has no concept of GCP
# identity. Both layers restrict the SAME real traffic, using
# genuinely different mechanisms -- either one failing independently
# still leaves the other in place.
#
# SAFETY: the SSH rule below is the single most important line in
# this file. Test any change with `nft -c -f` before ever loading it, 
# and use a delayed self-revert (see deployment notes) on
# first application -- IAP tunnel SSH is the only access path to this
# host, and a mistake may yield a lengthy lockout-bipass.

flush ruleset

table inet filter {
  chain input {
    type filter hook input priority 0; policy drop;

    # Loopback -- required for the OS and any local process
    # (like sign-server.py) talking to itself
    iif "lo" accept

    # Already-established connections -- without this no return traffic 
    # would be allowed
    ct state established,related accept

    # SSH via IAP TCP forwarding only. 35.235.240.0/20 (Google's
    # own published, fixed range for IAP tennulling) -- confirmed matching the
    # existing VPC-level rule (allow_iap_to_control_node_ssh).
    tcp dport 22 ip saddr 35.235.240.0/20 accept

    # Signing service -- restricted to the control-subnet.
    tcp dport 9443 ip saddr 10.60.10.0/24 accept

    # ICMP -- basic reachability diagnostics
    ip protocol icmp accept
  }
}
