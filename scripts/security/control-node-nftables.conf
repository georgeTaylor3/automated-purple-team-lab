#!/usr/sbin/nft -f
#
# Host-based firewall for control-node, satisfying NIST 800-53
# SC-7(12) (Host-Based Protection) -- an independent, host-level
# enforcement layer alongside the VPC firewall (base SC-7), not a
# replacement for it.
#
# The VPC firewall enforces identity (GCP service accounts); this
# ruleset enforces IP, since a host firewall has no concept of GCP
# identity. Both layers restrict the SAME real traffic, using
# genuinely different mechanisms -- either one failing independently
# still leaves the other in place.
#
# TWO SEPARATE TABLES, for a confirmed, real reason -- not stylistic.
# Traffic to a Docker-published port (CALDERA/Fleet/Elasticsearch/CA
# signing/Kibana) is DNAT'd in PREROUTING and travels through FORWARD
# -- it never reaches our own table's INPUT chain at all, confirmed
# directly: packet counters on an earlier, INPUT-only version of
# these rules stayed at zero while real, successful traffic
# demonstrably passed through. SSH is different -- sshd binds
# directly to the host's own stack, genuinely traverses INPUT, and
# that rule alone was doing real work the whole time.
#
#   inet filter / input  -- SSH only (genuinely host-direct traffic)
#   ip filter / DOCKER-USER -- the five Docker-published ports
#     (Docker's own official customization chain, hooked to FORWARD,
#     evaluated BEFORE Docker's own auto-generated rules, which
#     Docker's own rule-regeneration logic is documented to never
#     touch or overwrite)
#
# Scoped flushes throughout -- never `flush ruleset`. An earlier
# version used it and silently destroyed Docker's own separate
# nftables tables, breaking container networking entirely. `flush
# table` and `flush chain` are confirmed to leave every table/chain
# they don't explicitly name completely untouched, regardless of
# creation order.
#
# Every source range below is confirmed directly against this
# project's own committed Terraform firewall rules, not assumed --
# see terraform/firewall.tf: allow_iap_to_control_node_ui (IAP range
# for 8888/5601/9200, admin browser access) and the three
# allow_target_to_*_ingress rules (target-subnet ranges for real
# C2/enrollment/data traffic on 8888/8220/9200). 9443 (the CA signing
# service) is scoped to target subnets only, matching its actual
# purpose -- targets requesting certs, not an admin-facing port.
#
# Every rule carries an explicit `counter` -- not automatic in
# nftables, has to be requested per rule. Lets `nft list ruleset`
# show real, live packet/byte counts confirming legitimate traffic is
# actually passing through each rule, not just that the rule exists.
#
# SAFETY: the SSH rule below is the single most important line in
# this file. Any change must pass `nft -c -f` before being trusted,
# and this file's own apply step (see deploy script) verifies the
# loaded ruleset's SSH rule is genuinely present and correct after
# loading -- not just that the source file looks right -- falling
# back to the inet filter table alone being emptied (never touching
# DOCKER-USER, which has nothing to do with SSH safety) if that check
# ever fails.

add table inet filter
flush table inet filter

table inet filter {
  chain input {
    type filter hook input priority 0; policy drop;

    # Loopback -- required for the OS and any local process
    # (like sign-server.py) talking to itself
    iif "lo" counter accept

    # Already-established connections -- without this no return
    # traffic would be allowed
    ct state established,related counter accept

    # SSH via IAP TCP forwarding only. 35.235.240.0/20 is Google's
    # own published, fixed range for IAP tunneling -- confirmed
    # matching the existing VPC-level rule
    # (allow_iap_to_control_node_ssh).
    tcp dport 22 ip saddr 35.235.240.0/20 counter accept

    # ICMP -- basic reachability diagnostics
    ip protocol icmp counter accept
  }
}

# Docker's own chain, not ours to create -- confirmed to already
# exist, empty, the moment Docker's daemon starts. flush chain (not
# flush table, not flush ruleset) touches only this one named chain,
# leaving DOCKER-USER's siblings (DOCKER, DOCKER-FORWARD,
# DOCKER-BRIDGE, DOCKER-CT, DOCKER-INTERNAL -- all actively managed
# by Docker itself) completely untouched.
flush chain ip filter DOCKER-USER

# CALDERA C2 -- IAP range for direct admin UI access, target subnets
# for real agent C2 traffic. Explicit drop after the accept, not a
# fallthrough -- DOCKER-USER has no chain-level policy of its own;
# unmatched traffic would otherwise fall through to Docker's own
# permissive default rather than being denied.
add rule ip filter DOCKER-USER tcp dport 8888 ip saddr { 35.235.240.0/20, 10.60.20.0/24, 10.60.30.0/24 } counter accept
add rule ip filter DOCKER-USER tcp dport 8888 counter drop

# Fleet Server enrollment/check-in -- target subnets only, no admin
# UI exposed on this port.
add rule ip filter DOCKER-USER tcp dport 8220 ip saddr { 10.60.20.0/24, 10.60.30.0/24 } counter accept
add rule ip filter DOCKER-USER tcp dport 8220 counter drop

# Elasticsearch -- IAP range for direct admin UI access, target
# subnets for enrolled agents shipping data.
add rule ip filter DOCKER-USER tcp dport 9200 ip saddr { 35.235.240.0/20, 10.60.20.0/24, 10.60.30.0/24 } counter accept
add rule ip filter DOCKER-USER tcp dport 9200 counter drop

# CA signing service -- target subnets only, matching its actual
# purpose (targets requesting certs), not an admin-facing port.
add rule ip filter DOCKER-USER tcp dport 9443 ip saddr { 10.60.20.0/24, 10.60.30.0/24 } counter accept
add rule ip filter DOCKER-USER tcp dport 9443 counter drop

# Kibana -- IAP range only, admin UI access.
add rule ip filter DOCKER-USER tcp dport 5601 ip saddr 35.235.240.0/20 counter accept
add rule ip filter DOCKER-USER tcp dport 5601 counter drop
