<svg width="680" height="390" viewBox="0 0 680 390" xmlns="http://www.w3.org/2000/svg" role="img">
<title>IAM trust relationships in the purple team lab, updated</title>
<desc>The human admin account impersonates two deployer service accounts, terraform-deployer and packer-deployer. terraform-deployer attaches control-node-sa as the identity for the persistent control-node instance running CALDERA, Elasticsearch, Kibana, and Fleet Server. packer-deployer attaches packer-builder-sa as the runtime identity on temporary Packer build VMs.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect width="680" height="390" fill="#ffffff"/>

<line x1="340" y1="96" x2="200" y2="160" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="340" y1="96" x2="480" y2="160" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="200" y1="216" x2="200" y2="280" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="480" y1="216" x2="480" y2="280" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<g>
  <rect x="230" y="40" width="220" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="340" y="60" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">Human admin account</text>
  <text x="340" y="78" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#185FA5">YubiKey MFA, owner role</text>
</g>

<g>
  <rect x="100" y="160" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="200" y="180" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#3C3489">terraform-deployer</text>
  <text x="200" y="198" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#534AB7">Manages infra via IaC</text>
</g>

<g>
  <rect x="380" y="160" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="480" y="180" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#3C3489">packer-deployer</text>
  <text x="480" y="198" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#534AB7">Builds golden images</text>
</g>

<g>
  <rect x="100" y="280" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="200" y="300" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">control-node-sa</text>
  <text x="200" y="318" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0F6E56">Runs CALDERA/Elastic/Fleet</text>
</g>

<g>
  <rect x="380" y="280" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="480" y="300" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">packer-builder-sa</text>
  <text x="480" y="318" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0F6E56">Runs on temp build VM</text>
</g>

<text x="200" y="360" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">Attached as runtime SA</text>
<text x="480" y="360" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">Attached as runtime SA</text>
</svg>
