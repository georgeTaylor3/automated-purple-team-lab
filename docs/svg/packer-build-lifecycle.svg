<svg width="680" height="590" viewBox="0 0 680 590" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Packer image build lifecycle with accounts and firewall rules</title>
<desc>Five stages: the human account impersonates packer-deployer; packer-deployer creates a temporary VM running as packer-builder-sa; an IAP tunnel connects over WinRM 5986 for Windows or SSH 22 for Ubuntu, permitted by the allow-iap-to-packer rules and IAP tunnel IAM roles; provisioners download and install software over HTTPS, permitted by the allow-packer-https-egress rule; finally a custom image is created and the temporary VM and disk are destroyed, using the packerImageManager and packerImageBuilder IAM roles.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect width="680" height="590" fill="#ffffff"/>

<line x1="340" y1="104" x2="340" y2="144" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="340" y1="208" x2="340" y2="248" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="340" y1="312" x2="340" y2="352" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="340" y1="416" x2="340" y2="456" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<g>
  <rect x="40" y="40" width="600" height="64" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="340" y="66" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">1. Human identity impersonates packer-deployer</text>
  <text x="340" y="88" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#444441">Local ADC, no static keys</text>
</g>

<g>
  <rect x="40" y="144" width="600" height="64" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="340" y="170" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">2. Temporary VM created, runs as packer-builder-sa</text>
  <text x="340" y="192" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#444441">Uses packerImageBuilder role</text>
</g>

<g>
  <rect x="40" y="248" width="600" height="64" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="340" y="274" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#712B13">3. IAP tunnel connects: WinRM 5986 or SSH 22</text>
  <text x="340" y="296" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#993C1D">allow-iap-to-packer rule, tunnelResourceAccessor</text>
</g>

<g>
  <rect x="40" y="352" width="600" height="64" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="340" y="378" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#712B13">4. Provisioners run, download agent binaries</text>
  <text x="340" y="400" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#993C1D">allow-packer-https-egress rule</text>
</g>

<g>
  <rect x="40" y="456" width="600" height="64" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="482" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">5. Image saved, temporary VM and disk destroyed</text>
  <text x="340" y="504" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0F6E56">Uses packerImageManager role</text>
</g>

<text x="140" y="555" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">Account / identity</text>
<text x="340" y="555" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">Network / firewall</text>
<text x="540" y="555" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">Build artifact</text>
</svg>
