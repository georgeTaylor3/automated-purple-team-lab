<svg width="680" height="420" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg" role="img">
<title>control-node container architecture</title>
<desc>A self-deploying systemd timer clones the public GitHub repo and fetches the elastic and kibana_system passwords from Secret Manager, writing them to a local .env file. It then brings up four Docker Compose services: Elasticsearch first, then Kibana with its kibana_system password automatically synced, Fleet Server for enrolling Elastic Agents, and CALDERA for running attack simulations.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect width="680" height="420" fill="#ffffff"/>

<line x1="180" y1="116" x2="340" y2="200" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="500" y1="116" x2="340" y2="200" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="340" y1="256" x2="109" y2="320" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="340" y1="256" x2="263" y2="320" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="340" y1="256" x2="417" y2="320" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="340" y1="256" x2="571" y2="320" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<g>
  <rect x="40" y="60" width="280" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="180" y="80" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">GitHub repo (public)</text>
  <text x="180" y="98" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#444441">Cloned or pulled every run</text>
</g>

<g>
  <rect x="360" y="60" width="280" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="500" y="80" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Secret Manager</text>
  <text x="500" y="98" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#444441">elastic + kibana_system creds</text>
</g>

<g>
  <rect x="210" y="200" width="260" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="340" y="220" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#3C3489">control-node deploy script</text>
  <text x="340" y="238" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#534AB7">systemd timer, self-healing</text>
</g>

<g>
  <rect x="40" y="320" width="138" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="109" y="340" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">elasticsearch</text>
  <text x="109" y="358" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0F6E56">Starts first</text>
</g>

<g>
  <rect x="194" y="320" width="138" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="263" y="340" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">kibana</text>
  <text x="263" y="358" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0F6E56">Auto-synced pw</text>
</g>

<g>
  <rect x="348" y="320" width="138" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="417" y="340" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">fleet-server</text>
  <text x="417" y="358" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0F6E56">Enrolls agents</text>
</g>

<g>
  <rect x="502" y="320" width="138" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="571" y="340" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">caldera</text>
  <text x="571" y="358" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0F6E56">Runs attacks</text>
</g>

<text x="340" y="405" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">Only elastic + kibana_system passwords are secrets; STACK_VERSION defaults in compose</text>
</svg>
