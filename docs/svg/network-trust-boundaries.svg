<svg width="680" height="460" viewBox="0 0 680 460" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Network trust boundaries by service account identity, updated with Fleet Server and Elasticsearch</title>
<desc>Firewall rules grant access based on service account identity rather than IP range. Workstation target can reach the web target on port 443. Target service accounts on either the target subnet or the workstation subnet can reach control-node on CALDERA C2 port 8888, Fleet Server port 8220, and Elasticsearch port 9200. The control node cannot initiate connections to targets. Packer builder identities are isolated to build-time only and have no path to any target.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect width="680" height="460" fill="#ffffff"/>

<g>
  <rect x="40" y="30" width="600" height="180" rx="16" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="60" y="54" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Control subnet</text>
</g>
<g>
  <rect x="40" y="240" width="600" height="180" rx="16" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="60" y="264" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Target subnets (10.60.20.0/24, 10.60.30.0/24)</text>
</g>

<g>
  <rect x="260" y="80" width="180" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="350" y="100" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#712B13">control-node-sa</text>
  <text x="350" y="118" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#993C1D">C2, Fleet, ES</text>
</g>

<g>
  <rect x="60" y="150" width="180" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="150" y="174" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#444441">packer-builder-sa (build-time only, no target path)</text>
</g>

<g>
  <rect x="90" y="290" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="190" y="310" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">workstation-target-sa</text>
  <text x="190" y="328" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0F6E56">workstation subnet</text>
</g>

<g>
  <rect x="390" y="290" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="490" y="310" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">web-target-sa</text>
  <text x="490" y="328" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0F6E56">target subnet</text>
</g>

<line x1="290" y1="318" x2="388" y2="318" stroke="#1D9E75" stroke-width="1" marker-end="url(#arrow)"/>
<text x="339" y="308" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">443</text>

<path d="M190 290 L190 220 L350 220 L350 138" fill="none" stroke="#D85A30" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M490 290 L490 220 L370 220" fill="none" stroke="#D85A30" stroke-width="1" marker-end="url(#arrow)"/>

<text x="350" y="228" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">Targets initiate to control-node on 8888, 8220, 9200</text>
<text x="350" y="242" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">— never the reverse</text>

<text x="350" y="450" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">All other egress denied by default</text>
</svg>
